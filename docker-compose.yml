services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_TAG:-neubox-mcp:1.0}
    container_name: neubox-mcp
    ports:
      - "${MCP_HOST_PORT:-8000}:8000"
    env_file:
      - .env
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped

networks:
  app_net:
    driver: bridge